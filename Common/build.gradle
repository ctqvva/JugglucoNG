plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp' version '2.2.21-2.0.4'
}

// Single source of truth for toolchain + dependency versions.
ext {
    // Bump the app version here only. Wear releases use appVersionCode + 1000000
    // so Play accepts both APKs in one release (distinct versionCodes per form
    // factor). Scheme originates on the wearos branch — keep the two in step.
    appVersionCode = 1012
    // Base version, without the flavour/build-type suffix chain that gets appended
    // to versionName. Used for the APK filename so it stays readable.
    appVersionName = '1.1.2-Alpha'

    ndkver       = '29.0.14206865'
    CMAKEVERSION = '3.22.1'
    CPPSTD       = '-std=gnu++26'
    TARGETSDK    = 35
    APPCOMPAT    = '1.7.1'
    GMSBASE      = '18.9.0'
    GMSWEAR      = '19.0.0'
}

android {
    buildFeatures.buildConfig = true
    namespace "tk.glucodata"

//Can be defined in ~/.gradle/gradle.properties by setting for example:
//thepassword = IDontKnow
//thekeyalias = thealias
//thekeypassword = IDontKnow
//thekeyfile = everyone.keystore
    signingConfigs {
        alg {
            if (project.hasProperty('thekeypassword') && "$thekeypassword" != "") {
                storeFile file("$thekeyfile")
                storePassword "$thepassword"
                keyAlias "$thekeyalias"
                keyPassword "$thekeypassword"
            } else {
                storeFile file("everyone.keystore")
                storePassword "IDontKnow"
                keyAlias "thealias"
                keyPassword "IDontKnow"
            }
        }
    }

    defaultConfig {
        applicationId "tk.glucodata.ng"
        versionName appVersionName
        versionCode appVersionCode

        targetSdk TARGETSDK
        minSdk 26
        minSdkVersion 26
        buildConfigField 'int', 'targetSDK', "$targetSdk"
        buildConfigField 'int', 'minSDK', "$minSdk"
        manifestPlaceholders["minSDK"] = "$minSdk"
        manifestPlaceholders["targetSDK"] = "$targetSdk"

        // Was the `google` product flavour. Play Services is now unconditional, so
        // the dimension only made every variant name one word longer.
        buildConfigField 'int', 'Google', '1'
        buildConfigField 'int', 'noZXing', '0'
        manifestPlaceholders["debuggable"] = "false"
        manifestPlaceholders["requireWatch"] = "true"

        // versionName gets '-phone'/'-wear' and 'DUB'/'DEBUG' appended per variant, so it can't
        // be compared against a release tag. The in-app updater needs the bare number.
        buildConfigField 'String', 'BASE_VERSION_NAME', "\"$appVersionName\""
        // GitHub repo the in-app updater reads releases from. Forks change it here.
        buildConfigField 'String', 'UPDATE_REPO', '"ctqvva/JugglucoNG"'

        buildConfigField 'String', 'BUILD_TIME', 'new java.text.SimpleDateFormat("HH:mm:ss dd-MMM-yyyy").format(new java.util.Date(' + System.currentTimeMillis() + 'L))'
        buildConfigField 'int', 'isRelease', '0'
        buildConfigField 'int', 'isReleaseID', '0'

        // Every sensor backend is compiled into every build. These used to be
        // flavour dimensions (libreVersion / SiBionics / DexCom), but only one
        // combination was ever shipped, so all they did was make every variant
        // name three words longer.
        buildConfigField 'int', 'libreVersion', '3'
        buildConfigField 'int', 'SiBionics', '1'
        buildConfigField 'int', 'DexCom', '1'

        signingConfig signingConfigs.alg

        externalNativeBuild {
            cmake {
                version "$CMAKEVERSION"
                cppFlags " -DAPPID=\"quotes($applicationId)\"   -DAPPVERSION=\"quotes($versionName)\"  -DLIBRE3=1 -DSIBIONICS=1 -DDEXCOM=1 "
                cFlags " -DAPPID=\"quotes($applicationId)\"   -DAPPVERSION=\"quotes($versionName)\"  -DLIBRE3=1 -DSIBIONICS=1 -DDEXCOM=1 "
                arguments "-DJUGGLUCO_APP=TRUE -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=TRUE", "-Dlibre3=TRUE", "-DDEXCOM=TRUE"
            }
        }
    }

    flavorDimensions = ['wearos']

    productFlavors {
        mobile {
            dimension 'wearos'
            versionNameSuffix '-phone'
            buildConfigField 'int', 'isWear', '0'
        }
        wear {
            dimension 'wearos'
            targetSdk 34
            minSdk 26
            minSdkVersion 26
            buildConfigField 'int', 'minSDK', "$minSdk"
            manifestPlaceholders["minSDK"] = "$minSdk"
            versionCode 1000000 + appVersionCode //WATCH: mobile versionCode + 1M offset
            versionNameSuffix '-wear'
            signingConfig signingConfigs.alg
            buildConfigField 'int', 'isWear', '1'
            externalNativeBuild.cmake {
                arguments "-DWEAROS=TRUE"
                cppFlags " -DWEAROS=1  -DUSEDIN=1   "
                cFlags " -DWEAROS=1  -DUSEDIN=1   "
            }
            buildFeatures {
                viewBinding true
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.alg
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules.my', 'proguard-rules.log'

            buildConfigField 'int', 'isRelease', '1'
            buildConfigField 'int', 'isReleaseID', '1'
            buildConfigField 'int', 'doLog', '1'

            jniDebuggable false
            debuggable false
            externalNativeBuild.cmake {
                cppFlags "$CPPSTD", "-DRELEASEID=1", "-DRELEASE=1", "-DNORAWSTREAM=1", "-DRELEASEDIR=1"
                cFlags "-DRELEASEID=1", "-DRELEASE=1", "-DNORAWSTREAM=1", "-DRELEASEDIR=1"
            }
        }
        releasedub {
            versionNameSuffix 'DUB'
            applicationIdSuffix ".dub"
            resValue "string", "app_name", "JugglucoNG Dub"
            signingConfig signingConfigs.alg
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules.my', 'proguard-rules.log'
            jniDebuggable false
            debuggable false

            buildConfigField 'int', 'doLog', '1'
            buildConfigField 'int', 'isRelease', '1'
            buildConfigField 'int', 'isReleaseID', '1'
            externalNativeBuild.cmake {
                cppFlags "$CPPSTD", "-DRELEASEID=1", "-DRELEASE=1", "-DNORAWSTREAM=1", "-DRELEASEDIR=1", "-DAPPSUFFIX=\"quotes($applicationIdSuffix)\" "
                cFlags "-DRELEASEID=1", "-DRELEASE=1", "-DNORAWSTREAM=1", "-DRELEASEDIR=1", "-DAPPSUFFIX=\"quotes($applicationIdSuffix)\" "
            }
        }
        releasedub2 {
            versionNameSuffix 'DUB2'
            applicationIdSuffix ".dub2"
            resValue "string", "app_name", "JugglucoNG Dub 2"
            signingConfig signingConfigs.alg
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules.my', 'proguard-rules.log'
            jniDebuggable false
            debuggable false

            buildConfigField 'int', 'doLog', '1'
            buildConfigField 'int', 'isRelease', '1'
            buildConfigField 'int', 'isReleaseID', '1'
            externalNativeBuild.cmake {
                cppFlags "$CPPSTD", "-DRELEASEID=1", "-DRELEASE=1", "-DNORAWSTREAM=1", "-DRELEASEDIR=1", "-DAPPSUFFIX=\"quotes($applicationIdSuffix)\" "
                cFlags "-DRELEASEID=1", "-DRELEASE=1", "-DNORAWSTREAM=1", "-DRELEASEDIR=1", "-DAPPSUFFIX=\"quotes($applicationIdSuffix)\" "
            }
        }
        debug {
            manifestPlaceholders["requireWatch"] = "false"
            manifestPlaceholders["debuggable"] = "true"
            applicationIdSuffix ".debug"
            versionNameSuffix 'DEBUG'

            buildConfigField 'int', 'isReleaseID', '0'
            buildConfigField 'int', 'doLog', '1'

            jniDebuggable true
            debuggable true
            minifyEnabled false

            signingConfig signingConfigs.alg
            externalNativeBuild.cmake {
                cppFlags "$CPPSTD", "-DDEBUG=1", "-DSCANLOG=1", "-DAPPSUFFIX=\"quotes($applicationIdSuffix)\"", "-DNDK_DEBUG=1", "-UNDEBUG"
                cFlags "-DDEBUG=1", "-DSCANLOG=1", "-DAPPSUFFIX=\"quotes($applicationIdSuffix)\"", "-DNDK_DEBUG=1", "-UNDEBUG"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "$CMAKEVERSION"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    ndkVersion "${ndkver}"

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libg.so'
        jniLibs {
            useLegacyPackaging = true
            // The managed Kotlin Sibionics driver is self-contained. Keep the old native
            // implementation source for now, but never package its proprietary vendor blobs.
            excludes += [
                    '**/libdata-handle-lib*.so',
                    '**/libnative-algorithm-*.so',
                    '**/libnative-algorithm-jni-*.so',
                    '**/libnative-encrypy-decrypt-v110.so',
                    '**/libnative-sensitivity-v110.so',
                    '**/libnative-struct2json.so',
            ]
            doNotStrip '**/libcalibrate.so'
            doNotStrip '**/libcalibrat2.so'
            doNotStrip '**/libinit.so'
            doNotStrip '**/lib[A-Za-mo-z]?*.so'
        }
    }
    lint {
        abortOnError false
    }
    testOptions {
        unitTests {
            // tk.glucodata.Log falls back to android.util.Log whenever Applic.Nativesloaded is
            // false, which it always is under plain JVM unit tests. Without this, any test that
            // reaches a logging statement dies with "Method i in android.util.Log not mocked"
            // instead of testing anything.
            returnDefaultValues = true
        }
    }
    dependenciesInfo {
        includeInApk true
        includeInBundle true
    }
    compileSdkVersion 'android-36.1'
    buildToolsVersion '36.1.0'
    buildFeatures {
        aidl true
        compose true
    }

    sourceSets {
        // src/dex and src/libre3 used to be flavour source sets. Those flavours are
        // gone (everything is built in), so their sources belong to main now.
        // src/libre3/jniLibs is deliberately NOT listed: every .so in it is already
        // in src/main/jniLibs, byte for byte. Source-set layering used to hide that.
        main {
            java.srcDirs += ['src/dex/java', 'src/libre3/java']
        }
        // These used to hang off the mobileGoogle/wearGoogle flavour combinations.
        // Note `+=`: src/mobile/java and src/mobile/res are the flavour's own
        // defaults and must not be replaced. src/mobileSi/AndroidManifest.xml has
        // been merged into src/mobile/AndroidManifest.xml, since one source set
        // gets one manifest.
        mobile {
            java.srcDirs += ['src/mobileSi/java', 'src/mobileSiGoogle/java']
            res.srcDirs += ['src/mobileSi/res']
        }
        wear {
            java.srcDirs += ['src/wearSi/java']
            jniLibs.srcDirs += ['src/wearSi/jniLibs']
        }
    }
}

// APK filenames. The default is "Common-mobile-release.apk" -- module name first,
// no version. Produce JugglucoNG-<version>[-wear][-<build type>].apk instead, e.g.
// JugglucoNG-1.0.9-Alpha.apk / JugglucoNG-1.0.9-Alpha-dub.apk.
android.applicationVariants.all { variant ->
    def buildTypeTag = [release: '', releasedub: 'dub', releasedub2: 'dub2', debug: 'debug']
            .get(variant.buildType.name, variant.buildType.name)
    def parts = [variant.flavorName == 'wear' ? 'wear' : '', buildTypeTag].findAll { it }
    def suffix = parts ? '-' + parts.join('-') : ''
    variant.outputs.all { output ->
        output.outputFileName = "JugglucoNG-${appVersionName}${suffix}.apk"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Compose (versions come from the BOM unless pinned deliberately)
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-core:1.7.5'
    implementation 'androidx.compose.material:material-icons-extended:1.7.5'
    implementation 'androidx.compose.ui:ui-text-google-fonts:1.7.5'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.startup:startup-runtime:1.2.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation "androidx.appcompat:appcompat:$APPCOMPAT"
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.21'
    implementation "com.google.android.gms:play-services-base:$GMSBASE"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'

    compileOnly 'com.google.android.wearable:wearable:2.9.0'
    implementation "com.google.android.gms:play-services-wearable:$GMSWEAR"
    // implementation 'com.google.android.gms:play-services-wearable:10.2.0' Needed for China? https://developer.android.com/training/wearables/creating-app-china#data-layer

    // Glance Support
    implementation "androidx.glance:glance-appwidget:1.1.0"
    implementation "androidx.glance:glance-material3:1.1.0"
    implementation "androidx.work:work-runtime:2.9.1"

    // ---- mobile ----
    mobileImplementation 'com.google.android.material:material:1.13.0'
    mobileImplementation 'androidx.health.connect:connect-client:1.1.0'
    mobileImplementation 'com.garmin.connectiq:ciq-companion-app-sdk:2.3.0@aar'

    // Room Database for independent history storage
    def room_version = "2.7.1"
    mobileImplementation "androidx.room:room-runtime:$room_version"
    mobileImplementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // Scanning (QR / barcode). Used by src/mobileSi + the src/mobileSiGoogle
    // ZXing shim.
    def cameraXVersion = "1.4.2"
    mobileImplementation 'com.google.zxing:core:3.5.4'
    mobileImplementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    mobileImplementation "androidx.camera:camera-core:$cameraXVersion"
    mobileImplementation "androidx.camera:camera-camera2:$cameraXVersion"
    mobileImplementation "androidx.camera:camera-lifecycle:$cameraXVersion"
    mobileImplementation "androidx.camera:camera-view:$cameraXVersion"
    mobileImplementation 'com.google.guava:guava:33.5.0-android'
    mobileImplementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // ---- wear ----
    wearImplementation 'androidx.activity:activity-ktx:1.11.0'
    wearImplementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    wearImplementation 'com.google.android.material:material:1.13.0'
    wearImplementation 'androidx.databinding:viewbinding:8.13.0'
    wearImplementation 'androidx.wear:wear:1.3.0'
    wearImplementation 'androidx.percentlayout:percentlayout:1.0.0'
    wearImplementation 'androidx.legacy:legacy-support-v4:1.0.0'
    wearImplementation 'androidx.wear.watchface:watchface-style:1.2.1'
    wearImplementation 'androidx.wear.watchface:watchface-complications:1.2.1'
    wearImplementation 'androidx.wear.watchface:watchface-editor:1.2.1'
    wearImplementation 'androidx.wear.watchface:watchface-client:1.2.1'
    wearImplementation 'androidx.wear.watchface:watchface:1.2.1'
    wearImplementation 'androidx.wear.watchface:watchface-complications-rendering:1.2.1'
    wearImplementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
    wearImplementation 'androidx.core:core-splashscreen:1.2.0-rc01'
    wearImplementation 'androidx.wear.protolayout:protolayout-external-protobuf:1.3.0'
    // Wear Compose Material 3 (Expressive) UI
    wearImplementation 'androidx.wear.compose:compose-material3:1.6.2'
    wearImplementation 'androidx.wear.compose:compose-foundation:1.6.2'
    wearImplementation 'androidx.wear.compose:compose-navigation:1.6.2'
    wearImplementation 'androidx.wear:wear-ongoing:1.0.0'

    // Unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
