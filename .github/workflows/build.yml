name: Build GIS Monitor
on:
  workflow_dispatch:
  push:
    branches: [ gis-monitor, gis-monitor-v2 ]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: SDK packages
        run: |
          export SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.1" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;4.1.2"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
      - name: local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      - name: Build
        run: ./gradlew --no-daemon assembleMobileRelease 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Why failed
        if: failure()
        shell: bash
        run: |
          echo "::error title=Gradle::$(grep -n -i -E 'What went wrong|error:|FAILED|not found|Could not|No such|Execution failed' -A3 build.log | head -25 | tr '\n' '|' | cut -c1-3500)"
          echo "::error title=Kotlin::$(grep -E '^e: ' build.log | sed 's|file:///home/runner/work/JugglucoNG/JugglucoNG/||' | head -12 | tr '\n' '|' | cut -c1-3500)"
          echo "::error title=Variants::$(./gradlew --no-daemon -q tasks --all 2>/dev/null | grep -i '^assemble' | head -20 | tr '\n' '|')"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: GIS-Monitor-apk
          path: "**/build/outputs/apk/**/*.apk"
      - name: Publish APK to monitor-apk branch
        run: |
          f=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -1)
          mkdir -p "$RUNNER_TEMP/apk"; cp "$f" "$RUNNER_TEMP/apk/gis-monitor.apk"
          cd "$RUNNER_TEMP/apk"; git init -q; git checkout -q -b monitor-apk; git add gis-monitor.apk
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "APK for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" monitor-apk

  emu:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GIS-Monitor-apk
          path: dl
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Find apk
        run: |
          find dl -name "*.apk" | head -3
          echo "APK=$(find dl -name '*.apk' | head -1)" >> $GITHUB_ENV
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: bash emu.sh
